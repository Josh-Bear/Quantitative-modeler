services:

  # ── MongoDB ──────────────────────────────────────────────────────
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--quiet"]   # suppress connection lifecycle logs
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"   # expose so Compass can connect directly
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://db:27017   # override for Docker network
      WATCHFILES_FORCE_POLLING: "true"  # macOS bind-mounts miss fsevents → poll instead
    volumes:
      - ./backend:/app                  # live source — edit + auto-reload, no rebuild
    # --reload watches /app and restarts uvicorn on every save (dev workflow)
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── React (Vite) frontend ─────────────────────────────────────────
  frontend:
    build:
      context: .                       # model root, so engine/ + style.css are copyable
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src        # HMR in dev
      - ./style.css:/app/src/style.css # canonical style.css (root copy)
      - ./engine:/app/public/engine    # canonical BL engine (root copy)
    ports:
      - "8770:5173"   # Vite dev server
    depends_on:
      - backend

volumes:
  mongo_data:
